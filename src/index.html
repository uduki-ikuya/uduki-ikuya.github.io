<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="小説家・{{ .Name }}（uduki-ikuya）の公式ポートフォリオサイトです。ネット上で公開している作品情報やSNSリンクをまとめています。">
  <meta name="robots" content="index, follow">
  <title>{{ .Name }} | 小説家ポートフォリオ</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✍️</text></svg>">
</head>
<body>

  <div class="container">
    <header>
      <div class="avatar-container">
        <div class="avatar-fallback">幾</div>
      </div>
      <h1>{{ .Name }}</h1>
      <p class="subtitle">{{ .Subtitle }}</p>
      <p class="bio">
        {{ .Bio }}
      </p>
    </header>

    <main class="links-section">
      {{ range .Links }}
      <a href="{{ .URL }}" target="_blank" rel="noopener noreferrer" class="link-card" id="{{ .ID }}">
        <div class="link-icon">
          {{ .SVGIcon }}
        </div>
        <div class="link-info">
          <span class="link-title">{{ .Title }}</span>
          <span class="link-description">{{ .Description }}</span>
        </div>
      </a>
      {{ end }}
    </main>

    <footer>
      <p class="copyright">&copy; 2026 uduki-ikuya. All rights reserved.</p>
    </footer>
  </div>

</body>
</html>
