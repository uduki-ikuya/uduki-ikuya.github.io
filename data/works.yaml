sections:
  - id: "posting-sites"
    title: "小説投稿サイト"
    description: "作品を投稿しているサイトをまとめています。よく使うサイトとその他の投稿先を掲載します。"
    items:
      - title: "カクヨム"
        platform: "よく使うサイト"
        url: "https://kakuyomu.jp/users/uduki-ikuya"
        domain: kakuyomu.jp
        description: "メインで利用している投稿サイトです。新しい小説はこちらに投稿することが多いです。"
      - title: "小説家になろう"
        platform: "よく使うサイト"
        url: "http://mypage.syosetu.com/708500/"
        domain: syosetu.com
        description: "カクヨムの次に投稿作品が多いサイト。サイト独自のコンテストにも参加しています。"
      - title: "エブリスタ"
        platform: "その他のサイト"
        url: "https://estar.jp/users/145985279"
        domain: "estar.jp"
        description: "自分にとっては最初期から投稿しているサイトの1つです。"
      - title: "ハーメルン"
        platform: "その他のサイト"
        url: "https://syosetu.org/user/388692/"
        domain: "syosetu.org"
        description: "長らく読み専でしたが、ときどき作品を投稿しています。"
      - title: "アルファポリス"
        platform: "その他のサイト"
        url: "https://www.alphapolis.co.jp/author/detail/302524410"
        domain: "alphapolis.co.jp"
        description: "ときどき利用している投稿サイトの1つです。"
      - title: "ノベルアップ＋"
        platform: "その他のサイト"
        url: "https://novelup.plus/user/213546973/profile"
        domain: "novelup.plus"
        description: "ときどき利用している投稿サイトの1つです。"
      - title: "pixiv"
        platform: "その他のサイト"
        url: "https://www.pixiv.net/users/23554777"
        domain: "pixiv.net"
        description: "ときどき利用している投稿サイトの1つです。"
      - title: "Tales"
        platform: "その他のサイト"
        url: "https://tales.note.com/uduki_ikuya"
        domain: "tales.note.com"
        description: "ときどき利用している投稿サイトの1つです。"
  - id: "recommended"
    title: "オススメの小説"
    description: "おすすめ作品はブログ記事で紹介しています。ぜひご覧ください。"
    items:
      - title: "自分がおすすめする小説について"
        platform: "ブログ記事"
        url: "https://uduki-ikuya.hatenablog.com/entry/self-recommendation-for-my-novels"
        summary: "自作作品のおすすめポイントをまとめたブログエントリです。"
  - id: "published-works"
    title: "投稿小説一覧"
    description: "投稿作品の履歴を公開しています。2025-02-12時点では収録率は3割程度です。"
    items:
      - title: "小説投稿履歴【公開版】"
        platform: "スプレッドシート"
        url: "https://drive.google.com/open?id=1Mqddn8n9E-JNri2zy_c3L0cWwCWNoNg2cjaehW6pT-A"
        summary: "投稿作品の履歴をまとめた公開スプレッドシートです。どなたでも閲覧できます。"
  - id: "micro-novel"
    title: "マイクロノベルについて"
    description: "Xなどの短文SNSでは140字小説などの短い作品も発表しています。数が多いためすべてをまとめきれていません。"
    items:
      - title: "マイクロノベル"
        platform: "短文SNS"
        summary: "Xなどでごく短い小説作品を投稿しています。プロフィールページよりSNSリンクをご確認ください。"
