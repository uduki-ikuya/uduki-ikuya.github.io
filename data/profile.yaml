name: "卯月 幾哉"
subtitle: "Web作家 ポートフォリオ"
avatar: "image/profile.png"
cover: "image/cover.jpg"
bio: |-
  卯月幾哉（うづき いくや）のホームページへようこそ。
  インターネットを中心に、アマチュアとして文芸創作活動をしています。本業は会社員です。
  初めて小説を書いたのは20年以上前。ブランクも多いですが、細々と創作を続けています。
  ときどき詩やエッセイを書くこともあります。

